<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="todo-card">
            <h1>To-Do List</h1>
            <p>Manage your daily tasks easily</p>

            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Add a new task...">
                <button id="addBtn">Add</button>
            </div>

            <div class="filter-row">
                <button class="filter-btn active" id="filterAll">All</button>
                <button class="filter-btn" id="filterActive">Active</button>
                <button class="filter-btn" id="filterCompleted">Completed</button>
            </div>

            <ul id="taskList">
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
